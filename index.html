<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM KRAFT — Laboratório</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">K</div>
        <div>
          <strong>CRM KRAFT</strong>
          <small>Ambiente de testes</small>
        </div>
      </div>

      <nav>
        <button class="nav-btn active" data-page="crm">CRM</button>
        <button class="nav-btn" data-page="calendar">Calendário</button>
        <button class="nav-btn" data-page="followups">Follow-ups</button>
      </nav>

      <div class="lab-note">
        <b>LAB</b>
        <span>Dados fictícios. Nada aqui altera o sistema real.</span>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <h1 id="page-title">CRM</h1>
          <p>Ambiente separado para testar interface e comportamento.</p>
        </div>
        <span class="status">● Teste local / GitHub Pages</span>
      </header>

      <section id="crm" class="page active">
        <div class="toolbar">
          <input id="crm-search" type="search" placeholder="Buscar cliente..." />
          <select id="seller-filter">
            <option value="Todos">Todos</option>
            <option value="Henrique">Henrique</option>
            <option value="Alessandro">Alessandro</option>
            <option value="Jaime">Jaime</option>
            <option value="Cleber">Cleber</option>
            <option value="Comercial">Comercial</option>
            <option value="Sem vendedor">Sem vendedor</option>
          </select>
        </div>

        <div class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Cliente</th>
                  <th>Cidade</th>
                  <th>UF</th>
                  <th>Vendedor</th>
                </tr>
              </thead>
              <tbody id="crm-table"></tbody>
            </table>
          </div>
          <div class="pager">
            <span id="crm-count"></span>
            <button id="load-more-crm">Carregar mais 10</button>
          </div>
        </div>
      </section>

      <section id="calendar" class="page">
        <div class="card">
          <div class="calendar-head">
            <button id="prev-month">‹</button>
            <h2 id="month-label"></h2>
            <button id="next-month">›</button>
          </div>
          <div id="calendar-grid" class="calendar-grid"></div>
        </div>
      </section>

      <section id="followups" class="page">
        <div class="stats">
          <article><small>Pendentes</small><b id="st-pending">0</b></article>
          <article><small>Atrasados</small><b id="st-overdue">0</b></article>
          <article><small>Próximos 7 dias</small><b id="st-next7">0</b></article>
          <article><small>Concluídos</small><b id="st-done">0</b></article>
        </div>

        <div class="toolbar">
          <input id="follow-search" type="search" placeholder="Buscar follow-up..." />
          <select id="follow-status">
            <option>Pendentes</option>
            <option>Atrasados</option>
            <option>Concluídos</option>
            <option>Todos</option>
          </select>
        </div>

        <div id="follow-list" class="follow-list"></div>
        <div class="pager">
          <span id="follow-count"></span>
          <button id="load-more-follow">Carregar mais 10</button>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
